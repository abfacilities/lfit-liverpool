[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/join/success"
  to = "/join/success/"
  status = 200

[[redirects]]
  from = "/join/cancelled"
  to = "/join/cancelled/"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
